# Recomendado: na raiz do repo use "docker compose up".
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arki_events}
      POSTGRES_USER: ${POSTGRES_USER:-arki_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arki_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  postgres_data:
