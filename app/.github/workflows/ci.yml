name: PR CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check: [lint, typecheck, build, test, 'test:coverage']
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/arki_test
      AUTH_SECRET: ci-test-secret-min-32-chars-long
      API_URL: http://localhost:3002
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3002
      EMAIL_FROM: noreply@localhost.local
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ${{ matrix.check }}
        run: bun run ${{ matrix.check }}

  e2e:
    name: e2e (dashboard)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: arki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d arki_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/arki_test
      AUTH_SECRET: ci-test-secret-min-32-chars-long
      NEXT_PUBLIC_DASHBOARD_URL: http://localhost:3000
      NEXT_PUBLIC_MARKETING_URL: http://localhost:3001
      NEXT_PUBLIC_API_URL: http://localhost:3002
      API_URL: http://localhost:3002
      EMAIL_FROM: noreply@localhost.local
      PLAYWRIGHT_BASE_URL: http://localhost:3000
      CI: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run database migrations
        run: bun --filter @workspace/database migrate

      - name: Install Playwright browser (chromium)
        run: bunx playwright install --with-deps chromium

      - name: Run e2e tests (chromium)
        run: bun --filter @workspace/dashboard test:e2e --project=chromium
